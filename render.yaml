# Render Blueprint specification for PassMan (Task 13.1)
services:
  - type: web
    name: passman-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: WEB_CONCURRENCY
        value: 4
      - key: DATABASE_URL
        fromDatabase:
          name: passman-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://passman.app,https://passman-web.vercel.app,http://localhost:3000
      - key: ANDROID_ACCESS_TOKEN_EXPIRES
        value: 10
      - key: ANDROID_REFRESH_TOKEN_EXPIRES
        value: 10
      - key: ANDROID_VAULT_LOCK
        value: 15
      - key: WEB_ACCESS_TOKEN_EXPIRES
        value: 10
      - key: WEB_REFRESH_TOKEN_EXPIRES
        value: 8
      - key: WEB_VAULT_LOCK
        value: 15

databases:
  - name: passman-db
    plan: starter
    region: oregon
    databaseName: passman
    user: passman_user
