# Fly.io configuration for PassMan API (Task 13.1)
app = "passman-api"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "info"
  PORT = "8000"
  ANDROID_ACCESS_TOKEN_EXPIRES = "10"
  ANDROID_REFRESH_TOKEN_EXPIRES = "10"
  ANDROID_VAULT_LOCK = "15"
  WEB_ACCESS_TOKEN_EXPIRES = "10"
  WEB_REFRESH_TOKEN_EXPIRES = "8"
  WEB_VAULT_LOCK = "15"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
